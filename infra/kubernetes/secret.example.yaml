# Example only - do not apply as-is and never commit real values.
#
# In a real AKS deployment, this Secret would typically not be hand-written
# at all: a workload using the managed identity from
# infra/terraform/environments/dev (azurerm_user_assigned_identity.workload)
# would read the Azure OpenAI key directly from Key Vault via the Secrets
# Store CSI Driver or workload identity federation, so no application
# credential ever exists as a Kubernetes Secret. This file documents the
# shape of the values the app would otherwise expect.
apiVersion: v1
kind: Secret
metadata:
  name: adops-poc-secrets
  namespace: adops-poc
type: Opaque
stringData:
  APP_AZURE_OPENAI_API_KEY: "REPLACE_ME"
