[project]
name = "azure-devops-operations-poc"
version = "0.1.0"
description = "Azure-focused DevOps operations POC: explainable risk assessment for deployment and infrastructure events"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
